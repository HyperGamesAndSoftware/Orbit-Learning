<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wario Cart | Orbit Arcade</title>
  <style>
    :root{--ink:#07131d;--cyan:#62f2d0;--pink:#ff668e;--cream:#f8f2df;--panel:rgba(7,19,29,.84)}
    *{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07131d;color:var(--cream);font-family:Arial,sans-serif}body{cursor:default}canvas{display:block}
    #hud{position:fixed;inset:0;pointer-events:none;z-index:2;padding:22px 28px;display:flex;justify-content:space-between;align-items:flex-start;text-transform:uppercase;letter-spacing:.13em;font-size:10px}
    .hud-block{background:var(--panel);border:1px solid rgba(98,242,208,.35);padding:12px 15px;min-width:130px;backdrop-filter:blur(8px)}.hud-block b{display:block;font-size:22px;color:var(--cyan);letter-spacing:-.05em;margin-top:4px}.hud-right{display:flex;gap:10px;text-align:right}.hud-right .hud-block{min-width:115px}
    #message{position:fixed;left:50%;top:15%;transform:translateX(-50%);z-index:3;pointer-events:none;text-align:center;opacity:0;transition:opacity .25s}.message-title{font-size:clamp(32px,7vw,80px);font-weight:900;letter-spacing:-.08em;color:var(--pink);text-shadow:5px 5px 0 var(--ink)}.message-sub{font-size:11px;letter-spacing:.2em;color:var(--cream)}
    #start-screen{position:fixed;inset:0;z-index:5;background:radial-gradient(circle at 75% 25%,#244852,#07131d 58%);display:grid;place-items:center;padding:24px}.start-card{max-width:600px;text-align:center;border:1px solid rgba(98,242,208,.4);background:rgba(7,19,29,.84);padding:clamp(28px,6vw,62px);box-shadow:12px 12px 0 var(--pink)}.kicker{font-size:10px;letter-spacing:.25em;color:var(--cyan)}h1{font-size:clamp(48px,10vw,100px);line-height:.8;letter-spacing:-.1em;margin:23px 0 28px}.start-card h1 span{color:var(--pink)}.start-card p{color:#b8c6c4;line-height:1.6;font-size:14px;max-width:420px;margin:0 auto 27px}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;color:#91aaa9;font-size:9px;letter-spacing:.1em;margin-bottom:28px}.controls div{border:1px solid rgba(248,242,223,.18);padding:12px 5px}.controls b{display:block;color:var(--cream);font-size:16px;margin-bottom:5px}.start-button{border:0;background:var(--cyan);color:var(--ink);font-weight:900;letter-spacing:.12em;padding:15px 28px;cursor:pointer;font-size:12px}.start-button:hover{background:var(--pink)}
    #touch-controls{display:none;position:fixed;z-index:4;bottom:22px;left:20px;right:20px;justify-content:space-between;pointer-events:none}.touch-pad{display:flex;gap:10px}.touch-button{pointer-events:auto;width:55px;height:55px;border:1px solid rgba(98,242,208,.7);background:var(--panel);color:var(--cream);font-size:20px;border-radius:50%}.touch-button:active{background:var(--pink)}
    @media(max-width:700px){#hud{padding:12px;font-size:8px}.hud-block{min-width:90px;padding:9px}.hud-block b{font-size:17px}.hud-right .hud-block{min-width:88px}.controls{grid-template-columns:1fr 1fr}.controls div:last-child{grid-column:span 2}#touch-controls{display:flex}.start-card{box-shadow:7px 7px 0 var(--pink)}}
  </style>
</head>
<body>
  <div id="start-screen"><div class="start-card"><div class="kicker">NEON CIRCUIT // PRIVATE ARCADE</div><h1>WARIO<span>//</span>CART</h1><p>A longer 3D kart race through the night. Dodge obstacles, hold accelerate, and release a drift to fire a mini-turbo.</p><div class="controls"><div><b>W / ↑</b>ACCELERATE</div><div><b>A D / ← →</b>STEER</div><div><b>S / ↓</b>BRAKE</div><div><b>SPACE</b>DRIFT</div><div><b>E</b>USE ITEM</div></div><button class="start-button" id="start-button">PLAY</button></div></div>
  <div id="hud"><div class="hud-block">LAP <b id="lap">1 / 3</b></div><div class="hud-right"><div class="hud-block">POSITION <b id="position">1 / 4</b></div><div class="hud-block">ITEM <b id="item">—</b></div></div></div>
  <div id="message"><div class="message-title" id="message-title"></div><div class="message-sub" id="message-sub"></div></div>
  <div id="touch-controls"><div class="touch-pad"><button class="touch-button" data-key="ArrowLeft">←</button><button class="touch-button" data-key="ArrowRight">→</button></div><div class="touch-pad"><button class="touch-button" data-key="Space">DRIFT</button><button class="touch-button" data-key="ArrowUp">▲</button><button class="touch-button" data-key="KeyE">ITEM</button></div></div>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x07131d);
    scene.fog = new THREE.Fog(0x07131d, 220, 700);
    const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, .1, 600);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; document.body.appendChild(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0x96d8ed, 0x102020, 1.8));
    const sun = new THREE.DirectionalLight(0xffe7c4, 3); sun.position.set(-60, 90, 30); sun.castShadow = true; scene.add(sun);

    const trackGroup = new THREE.Group(); scene.add(trackGroup);
    const points = []; const trackRadius = { x: 230, z: 138 }; const trackWidth = 3400;
    for (let index = 0; index < 96; index += 1) { const angle = (index / 96) * Math.PI * 2; points.push(new THREE.Vector3(Math.cos(angle) * trackRadius.x, 0, Math.sin(angle) * trackRadius.z)); }
    function trackPoint(t, lane = 0) { const angle = (t % 1) * Math.PI * 2; return new THREE.Vector3(Math.cos(angle) * (trackRadius.x + lane), 0, Math.sin(angle) * (trackRadius.z + lane * .58)); }
    function tangent(t) { const angle = (t % 1) * Math.PI * 2; return new THREE.Vector3(-Math.sin(angle) * trackRadius.x, 0, Math.cos(angle) * trackRadius.z).normalize(); }
    function addBox(width, height, depth, color, position, parent = trackGroup) { const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, height, depth), new THREE.MeshStandardMaterial({ color, roughness: .8 })); mesh.position.copy(position); mesh.castShadow = true; mesh.receiveShadow = true; parent.add(mesh); return mesh; }
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.MeshStandardMaterial({ color: 0x0d2429, roughness: 1 })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
    for (let index = 0; index < points.length; index += 1) { const point = points[index]; const next = points[(index + 1) % points.length]; const midpoint = point.clone().lerp(next, .5); const length = point.distanceTo(next) + .7; const road = addBox(trackWidth, .35, length, index % 2 ? 0x263643 : 0x2b3c4a, midpoint); road.rotation.y = Math.atan2(next.x - point.x, next.z - point.z); }
    for (let index = 0; index < points.length; index += 2) { const point = points[index]; const next = points[(index + 1) % points.length]; const midpoint = point.clone().lerp(next, .5); const length = point.distanceTo(next) + .8; const left = addBox(1.2, 1.4, length, index % 4 ? 0xff668e : 0xf8f2df, midpoint.clone().add(new THREE.Vector3(Math.cos(index / 96 * Math.PI * 2) * (trackWidth / 2), .7, Math.sin(index / 96 * Math.PI * 2) * (trackWidth / 2)))); left.rotation.y = Math.atan2(next.x - point.x, next.z - point.z); const right = left.clone(); right.material = left.material.clone(); right.material.color.setHex(index % 4 ? 0xf8f2df : 0xff668e); right.position.copy(midpoint.clone().add(new THREE.Vector3(-Math.cos(index / 96 * Math.PI * 2) * (trackWidth / 2), .7, -Math.sin(index / 96 * Math.PI * 2) * (trackWidth / 2)))); trackGroup.add(right); }
    for (let index = 0; index < 42; index += 1) { const angle = index / 42 * Math.PI * 2; const tree = new THREE.Group(); tree.position.set(Math.cos(angle) * 315, 0, Math.sin(angle) * 190); const trunk = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2.2, 9, 7), new THREE.MeshStandardMaterial({ color: 0x6e4936 })); trunk.position.y = 4.5; const crown = new THREE.Mesh(new THREE.ConeGeometry(7, 18, 8), new THREE.MeshStandardMaterial({ color: index % 2 ? 0x184c49 : 0x1e5a4f })); crown.position.y = 14; tree.add(trunk, crown); scene.add(tree); }
    const startLine = new THREE.Mesh(new THREE.PlaneGeometry(trackWidth, 5), new THREE.MeshBasicMaterial({ color: 0xf8f2df, side: THREE.DoubleSide })); startLine.rotation.x = -Math.PI / 2; startLine.position.set(trackRadius.x, .2, 0); scene.add(startLine);

    function makeKart(color) { const kart = new THREE.Group(); const body = new THREE.Mesh(new THREE.BoxGeometry(3.7, 1.1, 5.2), new THREE.MeshStandardMaterial({ color, metalness: .15, roughness: .55 })); body.position.y = 1.15; body.castShadow = true; const nose = new THREE.Mesh(new THREE.BoxGeometry(2.6, .65, 1.4), body.material); nose.position.set(0, 1.65, -1.7); const seat = new THREE.Mesh(new THREE.BoxGeometry(2, .8, 1.8), new THREE.MeshStandardMaterial({ color: 0x111923 })); seat.position.set(0, 1.8, .65); const wheelMaterial = new THREE.MeshStandardMaterial({ color: 0x111318 }); [-1, 1].forEach(side => [-1, 1].forEach(front => { const wheel = new THREE.Mesh(new THREE.CylinderGeometry(.72, .72, .5, 12), wheelMaterial); wheel.rotation.z = Math.PI / 2; wheel.position.set(side * 2, .75, front * 1.65); kart.add(wheel); })); kart.add(body, nose, seat); return kart; }
    const player = { mesh: makeKart(0x62f2d0), t: .01, lane: -7.5, speed: 0, lap: 0, lastT: .01, drift: 0, boost: 0, item: null }; scene.add(player.mesh);
    const opponents = [0, 1, 2].map((index) => { const opponent = { mesh: makeKart([0xff668e, 0xffcb5a, 0xb58cff][index]), t: .01, lane: [-2.5, 2.5, 7.5][index], speed: .0000025 + index * .00000018, lap: 0, lastT: .01 }; scene.add(opponent.mesh); return opponent; });
    [player, ...opponents].forEach(kart => { kart.mesh.position.copy(trackPoint(kart.t, kart.lane)); kart.mesh.position.y = .35; kart.mesh.lookAt(trackPoint(kart.t + .01, kart.lane)); });
    const obstacles = []; [
      [.13, -4], [.22, 2.8], [.31, -1.5], [.43, 4], [.54, -3.2], [.66, 1.8], [.76, -4], [.87, 3]
    ].forEach(([trackPosition, lane]) => { const obstacle = addBox(5, 2.4, 5, 0xff668e, trackPoint(trackPosition, lane)); obstacle.position.y = 1.3; obstacle.material.emissive = new THREE.Color(0x441526); obstacle.material.emissiveIntensity = .8; obstacles.push({ mesh: obstacle, t: trackPosition, lane }); });
    const items = []; for (let index = 0; index < 8; index += 1) { const box = new THREE.Mesh(new THREE.BoxGeometry(2.4, 2.4, 2.4), new THREE.MeshStandardMaterial({ color: 0xf8f2df, emissive: 0xff668e, emissiveIntensity: .7 })); box.position.copy(trackPoint(.1 + index / 8 * .9, 0)); box.position.y = 2.3; box.rotation.y = Math.PI / 4; scene.add(box); items.push({ mesh: box, t: .1 + index / 8 * .9, collected: false }); }
    const keys = new Set(); addEventListener('keydown', event => { keys.add(event.code); if (event.code === 'KeyE') useItem(); }); addEventListener('keyup', event => keys.delete(event.code)); document.querySelectorAll('.touch-button').forEach(button => { button.addEventListener('pointerdown', () => keys.add(button.dataset.key)); button.addEventListener('pointerup', () => keys.delete(button.dataset.key)); button.addEventListener('pointerleave', () => keys.delete(button.dataset.key)); });
    function useItem() { if (!player.item) return; if (player.item === 'BOOST') { player.boost = 2.5; flash('BOOST!', 'SPEED SURGE'); } else { const target = opponents.find(opponent => opponent.t > player.t); if (target) { target.speed *= .55; setTimeout(() => target.speed = .000007, 1600); flash('POW!', 'PROJECTILE HIT'); } } player.item = null; document.querySelector('#item').textContent = '—'; }
    function flash(title, sub) { document.querySelector('#message-title').textContent = title; document.querySelector('#message-sub').textContent = sub; document.querySelector('#message').style.opacity = 1; setTimeout(() => document.querySelector('#message').style.opacity = 0, 900); }
    function obstaclePenalty(kart) { const hit = obstacles.some(obstacle => kart.mesh.position.distanceTo(obstacle.mesh.position) < 6); if (hit) { kart.speed *= .82; if (kart === player) flash('OBSTACLE', 'SLOW DOWN'); } }
    function edgePenalty(kart) { const edge = trackWidth / 2 - 3; if (Math.abs(kart.lane) > edge) { kart.speed *= .9; if (kart === player) flash('TRACK EDGE', 'SLOW DOWN'); } }
    function updateKart(kart, delta, isPlayer) { if (!isPlayer) { kart.t += kart.speed * delta; if (kart.t > 1) { kart.t -= 1; kart.lap += 1; } kart.mesh.position.copy(trackPoint(kart.t, kart.lane)); kart.mesh.position.y = .35; kart.mesh.lookAt(trackPoint(kart.t + .01, kart.lane)); obstaclePenalty(kart); edgePenalty(kart); return; } const accelerating = keys.has('ArrowUp') || keys.has('KeyW'); const braking = keys.has('ArrowDown') || keys.has('KeyS'); const drifting = keys.has('Space'); const steer = (keys.has('ArrowLeft') || keys.has('KeyA') ? 1 : 0) - (keys.has('ArrowRight') || keys.has('KeyD') ? 1 : 0); player.speed += (accelerating ? .00000007 : -.00000004) * delta; if (braking) player.speed -= .00000012 * delta; if (player.boost > 0) { player.speed += .0000001 * delta; player.boost -= delta / 1000; } player.speed = THREE.MathUtils.clamp(player.speed, 0, .0000085); player.lane += steer * (drifting ? .00012 : .00007) * delta; player.lane = THREE.MathUtils.clamp(player.lane, -14, 14); if (drifting && Math.abs(steer) > 0 && player.speed > .0000025) player.drift += delta; else if (player.drift > 500) { player.boost = Math.min(1.8, player.drift / 1000); flash('MINI TURBO', 'DRIFT RELEASED'); player.drift = 0; } else player.drift = 0; const oldT = player.t; player.t = (player.t + player.speed * delta) % 1; if (oldT > .8 && player.t < .2) { player.lap += 1; if (player.lap >= 3) finishRace(); } player.mesh.position.copy(trackPoint(player.t, player.lane)); player.mesh.position.y = .35; const forward = tangent(player.t); player.mesh.rotation.y = Math.atan2(forward.x, forward.z) + steer * (drifting ? .22 : .08); player.mesh.rotation.z = -steer * (drifting ? .14 : .04); obstaclePenalty(player); edgePenalty(player); }
    function collectItems() { items.forEach(item => { item.mesh.rotation.y += .03; item.mesh.position.y = 2.3 + Math.sin(performance.now() / 300 + item.t * 10) * .35; if (!item.collected && player.mesh.position.distanceTo(item.mesh.position) < 5) { item.collected = true; item.mesh.visible = false; player.item = Math.random() > .5 ? 'BOOST' : 'PROJECTILE'; document.querySelector('#item').textContent = player.item === 'BOOST' ? 'BOOST' : 'BLASTER'; flash('ITEM GET', player.item); setTimeout(() => { item.collected = false; item.mesh.visible = true; }, 8000); } }); }
    function finishRace() { player.lap = 3; flash('FINISH!', 'THE CIRCUIT IS YOURS'); running = false; document.querySelector('#start-button').textContent = 'RACE AGAIN'; document.querySelector('#start-screen').style.display = 'grid'; }
    let running = false; let previous = performance.now(); let animation;
    function animate(now) { animation = requestAnimationFrame(animate); const delta = Math.min(now - previous, 50); previous = now; if (running) { updateKart(player, delta, true); opponents.forEach(opponent => updateKart(opponent, delta, false)); collectItems(); document.querySelector('#lap').textContent = `${Math.min(player.lap + 1, 3)} / 3`; const position = 1 + opponents.filter(opponent => opponent.lap > player.lap || (opponent.lap === player.lap && opponent.t > player.t)).length; document.querySelector('#position').textContent = `${position} / 4`; } const cameraTarget = trackPoint(player.t, player.lane); const viewPoint = trackPoint(player.t - .004, player.lane); camera.position.lerp(new THREE.Vector3(viewPoint.x, 4.2, viewPoint.z), .12); camera.lookAt(cameraTarget.x, 1.4, cameraTarget.z); renderer.render(scene, camera); }
    document.querySelector('#start-button').addEventListener('click', () => {
      document.querySelector('#start-screen').style.display = 'none';
      document.body.requestFullscreen?.().catch(() => {});
      player.t = .01; player.lane = -7.5; player.lap = 0; player.speed = 0; opponents.forEach((opponent, index) => { opponent.t = .01; opponent.lane = [-2.5, 2.5, 7.5][index]; opponent.lap = 0; opponent.speed = .0000025 + index * .00000018; });
      [player, ...opponents].forEach(kart => { kart.mesh.position.copy(trackPoint(kart.t, kart.lane)); kart.mesh.position.y = .35; kart.mesh.lookAt(trackPoint(kart.t + .01, kart.lane)); });
      flash('3', 'GET READY');
      setTimeout(() => flash('2', ''), 700); setTimeout(() => flash('1', ''), 1400); setTimeout(() => { flash('GO!', 'RACE TO 3 LAPS'); running = true; }, 2100);
    });
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    animate(performance.now());
  </script>
</body>
</html>
