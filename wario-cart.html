<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wario Cart</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: 'Segoe UI', Tahoma, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; }
    body { margin: 0; overflow: hidden; background: radial-gradient(circle at 50% 10%, #c5efff 0, #68c4fe 45%, #224e78 100%); user-select: none; }
    #canvas-container { width: 100vw; height: 100vh; }
    #ui-overlay { position: fixed; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; gap: 12px; }
    #race-status { position: fixed; top: 92px; left: 20px; padding: 8px 14px; border: 1px solid rgba(255,255,255,.35); border-radius: 18px; background: rgba(0,0,0,.48); color: #fff; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; text-shadow: 1px 1px 3px #000; pointer-events: none; }
    #countdown { position: fixed; inset: 0; display: grid; place-items: center; color: #ffcc00; font-size: clamp(64px, 15vw, 180px); font-weight: 900; text-shadow: 0 0 25px #f00, 6px 6px #000; pointer-events: none; }
    #start-panel { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(9,18,30,.35); z-index: 4; }
    #start-panel section { max-width: 480px; margin: 20px; padding: 32px; border: 2px solid rgba(255,255,255,.4); background: rgba(0,0,0,.72); color: #fff; text-align: center; box-shadow: 10px 10px 0 rgba(0,0,0,.35); }
    #start-panel h1 { margin: 0 0 10px; color: #ffcc00; font-size: clamp(34px, 8vw, 64px); text-transform: uppercase; }
    #start-panel p { line-height: 1.5; }
    #start-race { padding: 13px 24px; border: 0; background: #e74c3c; color: #fff; font: 700 16px inherit; cursor: pointer; }
    #start-race:hover { background: #ffcc00; color: #111; }
    .hud-card { padding: 12px 24px; border: 3px solid rgba(255,255,255,.3); border-radius: 50px; background: rgba(0,0,0,.5); color: #fff; font-size: 24px; font-weight: 900; letter-spacing: 1.5px; text-shadow: 2px 2px 4px #000; box-shadow: 0 8px 20px rgba(0,0,0,.3); }
    #controls-hint { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 8px 16px; border: 1px solid rgba(255,255,255,.2); border-radius: 20px; background: rgba(0,0,0,.6); color: #eee; font-size: 14px; white-space: nowrap; pointer-events: none; }
    #finish-screen { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); display: none; color: #ffcc00; font-size: 48px; font-weight: 900; text-shadow: 0 0 20px #f00, 3px 3px #000; pointer-events: none; }
    @media (max-width: 640px) {
      .hud-card { padding: 9px 13px; font-size: 14px; }
      #controls-hint { max-width: calc(100vw - 30px); font-size: 11px; text-align: center; white-space: normal; }
      #finish-screen { width: 100%; text-align: center; font-size: 32px; }
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="this.onerror=null; this.src='https://unpkg.com/three@0.128.0/build/three.min.js';"></script>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="ui-overlay">
    <div class="hud-card" id="lap-display">LAP 1 / 3</div>
    <div class="hud-card" id="speed-display">0 KM/H</div>
  </div>
  <div id="race-status">Ready on grid</div>
  <div id="countdown"></div>
  <div id="finish-screen">COURSE COMPLETE!</div>
  <div id="start-panel"><section><h1>Wario Cart</h1><p>Drift, grab power-ups, hit shortcuts, and beat the rival karts.</p><button id="start-race" type="button">START RACE</button></section></div>
  <div id="controls-hint"><b>W / Up</b> accelerate · <b>S / Down</b> reverse · <b>A / D</b> steer · <b>Shift / Space</b> drift</div>
  <script src="wario-cart.js"></script>
</body>
</html>
